        <tr>
          <td></td>
          <td></td>
          <td></td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </table>

      <button id="restart">RestartGame</button>
      <p id="current-gamer"></p>
      <p id="winner"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
